name: Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install root dependencies
        run: npm install

      - name: Build solution
        run: npm run build

      - name: Upload solution artifact
        uses: actions/upload-artifact@v5
        with:
          name: dataverse-solution
          path: Solution/bin/Release/*.zip
          if-no-files-found: error
